<!-- The page the banner's "Cookie settings" link opens: a consent dialog with "Reject all", which the reject run must not use. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cookie settings</title>
  </head>
  <body>
    <div role="dialog" aria-label="Cookie preferences" style="position: fixed; bottom: 0">
      <p>Choose which cookies we may use.</p>
      <button type="button">Reject all</button>
      <button type="button">Save</button>
    </div>
  </body>
</html>
