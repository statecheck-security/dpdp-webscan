<!-- Privacy page with a consent dialog, so a reject run that wrongly follows "More information" would find "Reject all" here. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Privacy</title>
  </head>
  <body>
    <div role="dialog" aria-label="Cookie preferences" style="position: fixed; bottom: 0">
      <p>Choose which cookies we may use.</p>
      <button type="button">Reject all</button>
      <button type="button">Accept all</button>
    </div>
    <main><h1>Privacy policy</h1></main>
  </body>
</html>
