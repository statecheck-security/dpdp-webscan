<!-- Exercises: the consent-frame allowlist (WS-11c). A consent-looking banner is drawn inside an iframe from forms-fixture.in, which is not a CMP frame domain and not the site. Such a frame is never searched or clicked, so the scan reports no banner (and therefore no W3–W7), even though the frame's content would match. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banner in an unknown frame</title>
  </head>
  <body>
    <main><p>An ordinary page.</p></main>
    <iframe
      title="Widget"
      src="https://forms-fixture.in/banner.html"
      style="position: fixed; bottom: 0; left: 0; width: 100%; height: 160px; border: 0"
    ></iframe>
  </body>
</html>
