<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form page slot</title>
  </head>
  <body>
    <nav>
      <a href="/login">Log in</a>
      <a href="/about">About us</a>
      <a href="/assessment">Take the free assessment</a>
      <a href="/brochure.pdf">Brochure</a>
    </nav>
    <main><h1>Example Consulting</h1></main>
    <footer><a href="/privacy">Privacy Policy</a></footer>
  </body>
</html>
