<!-- Exercises: W3 (trackers still fire after "reject") and the WS-3e reject/accept runs. Nothing loads before a choice; "Reject all" still fires a tracker pixel and sets a cookie; "Accept all" fires the pixel and sets a consent cookie. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reject ignored</title>
  </head>
  <body>
    <div id="consent-banner" role="dialog" aria-label="Cookie consent" style="position: fixed; bottom: 0">
      <p>We use cookies to improve your experience.</p>
      <button type="button" id="reject">Reject all</button>
      <button type="button" id="accept">Accept all</button>
    </div>
    <p>An ordinary page.</p>
    <script>
      const banner = document.getElementById('consent-banner');
      document.getElementById('reject').addEventListener('click', () => {
        banner.hidden = true;
        document.cookie = 'trk_after_reject=1; path=/; max-age=3600';
        new Image().src = 'https://tracker-fixture.in/pixel.gif?choice=reject';
      });
      document.getElementById('accept').addEventListener('click', () => {
        banner.hidden = true;
        document.cookie = 'consent=accepted; path=/; max-age=3600';
        new Image().src = 'https://tracker-fixture.in/pixel.gif?choice=accept';
      });
    </script>
  </body>
</html>
